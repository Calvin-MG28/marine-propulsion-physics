<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Marine Propulsion Physics</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>

<body>

    <main class="app">

        <header>
            <p class="eyebrow">
                MARINE PROPULSION LAB
            </p>

            <h1>
                Propeller Physics
            </h1>

            <p class="subtitle">
                Torque, inertia and hydrodynamic resistance
            </p>
        </header>


        <section class="simulation">

            <div id="chart"></div>

        </section>


        <section class="controls">

            <div class="control">

                <label for="throttle">
                    ENGINE COMMAND
                </label>

                <input
                    id="throttle"
                    type="range"
                    min="-100"
                    max="100"
                    value="0"
                >

                <div class="throttle-labels">
                    <span>ASTERN</span>
                    <span>STOP</span>
                    <span>AHEAD</span>
                </div>

            </div>


            <div class="telemetry">

                <div>
                    <span>THROTTLE</span>
                    <strong id="throttleValue">
                        0%
                    </strong>
                </div>

                <div>
                    <span>PROPELLER</span>
                    <strong id="rpmValue">
                        0.0 RPM
                    </strong>
                </div>

                <div>
                    <span>TORQUE</span>
                    <strong id="torqueValue">
                        0.0
                    </strong>
                </div>

                <div>
                    <span>THRUST</span>
                    <strong id="thrustValue">
                        0.0
                    </strong>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
